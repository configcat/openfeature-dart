name: Test

on:
  schedule:
    - cron: '0 8 * * 1'
  push:
    branches: [ '*' ]
    paths-ignore:
      - '**.md'
      - 'examples/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'examples/**'
    
  workflow_dispatch:

jobs:
  analyze-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1.8.1

    - name: Install dependencies
      run: dart pub get

    - name: Verify formatting
      run: dart format --output=none --set-exit-if-changed .

    - name: Analyze project source
      run: dart analyze
      
  test:
    name: test (${{ matrix.package.name }}, Dart ${{ matrix.sdk-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-version: [ stable, beta, dev ]
        package:
          - name: server
            path: packages/server
          - name: client
            path: packages/client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk-version }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        working-directory: ${{ matrix.package.path }}
        run: dart test

  publish-dry-run:
    name: publish dry run (${{ matrix.package.name }}
    needs: [analyze-format, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - name: server
            path: packages/server
          - name: client
            path: packages/client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.8.1

      - name: Install dependencies
        run: dart pub get

      - name: Publish dry-run
        working-directory: ${{ matrix.package.path }}
        run: dart pub publish --dry-run
